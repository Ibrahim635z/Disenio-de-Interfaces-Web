<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        nav {
            background-color: darkslategray;
        }
        nav p {
            display: inline-block;
        }
        p{
            color: white;
            padding: 5px;
        }

        p:hover{
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <p>Inicio</p>
        <p>Acerca de</p>
        <p>Servicios</p>
        <p>Portafolio</p>
        <p>Contacto</p>
    </nav>
</body>
</html>
