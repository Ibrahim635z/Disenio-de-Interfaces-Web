<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        nav {
            background-color: aqua;
            clear: both;
            height: 50px;

        }
        nav p {
            display: inline-block;
        }
        p{
            background-color: white;
            padding: 5px;
            border: solid 1px black;
            padding: 10px;
            position: relative;
            left: 900px;
            bottom: 10px;
        }

        p:hover{
            
            cursor: pointer;
            background-color: black;
            color: white;
            
            
        }
        img{
            width: 50px;
            height: auto;
            position: relative;
            left: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="https://www.juntadeandalucia.es/" target="_blank"> 
            <img src="./images.png" alt="junta" >
        </a>
       
        <p>Inicio</p>
        <p>Servicios</p>
        <p>Contacto</p>
    </nav>
</body>
</html>
