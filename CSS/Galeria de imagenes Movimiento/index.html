<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Lightbox CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>Galeria de Imagenes</h3>
    
    <div class="container">
        <div class="gallery-item">
            <a href="#img1">
                <img src="./imagen1.jpg" alt="Foto 1">
                <div class="overlay"></div> </a>
        </div>

        <div class="gallery-item">
            <a href="#img2">
                <img src="./imagen2.jpg" alt="Foto 2">
                <div class="overlay"></div>
            </a>
        </div>
        
        <div class="gallery-item">
            <a href="#img3">
                <img src="./imagen3.jpg" alt="Foto 3">
                <div class="overlay"></div>
            </a>
        </div>

        <div class="gallery-item">
            <a href="#img4">
                <img src="./imagen4.jpg" alt="Foto 4">
                <div class="overlay"></div> </a>
        </div>

        <div class="gallery-item">
            <a href="#img5">
                <img src="./imagen5.jpg" alt="Foto 5">
                <div class="overlay"></div>
            </a>
        </div>
        
        <div class="gallery-item">
            <a href="#img6">
                <img src="./imagen6.jpg" alt="Foto 6">
                <div class="overlay"></div>
            </a>
        </div>

    </div>

    <section class="lightbox" id="img1">
        <div class="lightbox-content">
            <a href="#" class="close">X</a>
            <img src="./imagen1.jpg" alt="Foto 1 Grande">
        </div>
    </section>

    <section class="lightbox" id="img2">
        <div class="lightbox-content">
            <a href="#" class="close">X</a>
            <img src="./imagen2.jpg" alt="Foto 2 Grande">
        </div>
    </section>

    <section class="lightbox" id="img3">
        <div class="lightbox-content">
            <a href="#" class="close">X</a>
            <img src="./imagen3.jpg" alt="Foto 3 Grande">
        </div>
    </section>
        
        <section class="lightbox" id="img4">
        <div class="lightbox-content">
            <a href="#" class="close">X</a>
            <img src="./imagen4.jpg" alt="Foto 4 Grande">
        </div>
        </section>

        <section class="lightbox" id="img5">
        <div class="lightbox-content">
            <a href="#" class="close">X</a>
            <img src="./imagen5.jpg" alt="Foto 5 Grande">
        </div>
        </section>

        <section class="lightbox" id="img6">
        <div class="lightbox-content">
            <a href="#" class="close">X</a>
            <img src="./imagen6.jpg" alt="Foto 6 Grande">
        </div>
        </section>

    
    </body>
</html>
