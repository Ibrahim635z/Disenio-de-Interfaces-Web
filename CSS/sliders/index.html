<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="banner">
            <div class="slideshow">

                <h3>Greate sale</h3>
                <button class="slide-btn slide-btn-1"></button>
                <button class="slide-btn slide-btn-2"></button>
                <button class="slide-btn slide-btn-3"></button>
                <button class="slide-btn slide-btn-4"></button>

                <div class="slideshow-wrapper">
                <div class="slide"><img src="./images/slide-img-1.jpg" alt="slider1"></div>
                <div class="slide"><img src="./images/slide-img-2.jpg" alt="slider2"></div>
                <div class="slide"><img src="./images/slide-img-3.jpg" alt="slider3"></div>
                <div class="slide"><img src="./images/slide-img-4.jpg" alt="slider4"></div>
                </div>

                 <button class="shop-btn">
                    <p class="txt1">Shop now</p>
                    <p class="txt2">Its interesting</p>
                 </button>
            </div>
           
        </section>
    </main>
    
</body>
</html>
